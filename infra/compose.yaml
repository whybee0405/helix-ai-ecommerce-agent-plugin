services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eshopeo
      POSTGRES_PASSWORD: eshopeo
      POSTGRES_DB: eshopeo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshopeo"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    command: uvicorn eshopeo.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/core:/app
      - ../packs:/packs
      - ../connectors/woocommerce:/plugin:ro

  worker:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    command: celery -A eshopeo.workers.celery_app worker --loglevel=info -Q default,embedding
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/core:/app
      - ../packs:/packs
      - hf-cache:/root/.cache/huggingface

  web:
    build:
      context: /var/www/eshopeo-saas-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.eshopeo.cloudia.co.za
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  hf-cache:
