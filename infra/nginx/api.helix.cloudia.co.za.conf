# api.helix.cloudia.co.za → FastAPI on :8000
#
# After copying to /etc/nginx/sites-available/, run:
#   sudo ln -s /etc/nginx/sites-available/api-helix /etc/nginx/sites-enabled/api-helix
#   sudo certbot --nginx -d api.helix.cloudia.co.za
#   sudo nginx -s reload

server {
    listen 80;
    server_name api.helix.cloudia.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.helix.cloudia.co.za;

    # Populated by Certbot after: certbot --nginx -d api.helix.cloudia.co.za
    ssl_certificate     /etc/letsencrypt/live/api.helix.cloudia.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.helix.cloudia.co.za/privkey.pem;

    client_max_body_size 10M;

    # SSE streaming
    location /v1/widget/chat/stream {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Origin            $http_origin;
        proxy_connect_timeout 60s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }
}
